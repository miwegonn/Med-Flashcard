<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathognomonic Flashcard</title>
<style>
:root{--bg:#0d1016;--pnl:#161a23;--pnl2:#1d222e;--ln:#2b3242;--tx:#e7eaf0;--dim:#959db0;
  --acc:#5eb3ff;--acc2:#7ee0c0;--warn:#ffb454;--bad:#ff7b72;--good:#7ee787;--star:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:"Sarabun","Noto Sans Thai","Thonburi",-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
header.top .sub{color:var(--dim);font-size:13px}
.back{background:var(--pnl);border:1px solid var(--ln);border-radius:10px;padding:6px 12px;font-size:14px}
.back:hover{border-color:var(--acc)}

/* home */
.hero{text-align:center;margin:18px 0 22px}
.hero .logo{font-size:44px}
.hero h1{font-size:26px;margin:6px 0 2px}
.hero p{color:var(--dim);margin:0;font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{background:var(--pnl);border:1px solid var(--ln);border-radius:16px;padding:20px 16px;text-align:left;transition:.15s}
.mode:hover{border-color:var(--acc);transform:translateY(-2px)}
.mode .ic{font-size:30px}
.mode b{display:block;font-size:18px;margin:8px 0 2px}
.mode span{color:var(--dim);font-size:13px}
.panel{background:var(--pnl);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin-top:14px}
.panel h3{margin:0 0 10px;font-size:14px;color:var(--dim);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--pnl2);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:rgba(94,179,255,.16);border-color:var(--acc);color:#cfe6ff}
.chip.on.star{background:rgba(255,209,102,.14);border-color:var(--star);color:#ffe6a6}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--dim)}
.bar{height:8px;background:var(--pnl2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--good));border-radius:99px;transition:width .25s}
.reset{color:var(--bad);font-size:13px;margin-top:10px;opacity:.8}
.reset:hover{opacity:1;text-decoration:underline}

/* categories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:14px;text-align:left;position:relative;overflow:hidden}
.cat:hover{border-color:var(--h)}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--h)}
.cat .nm{font-weight:700;font-size:15px}
.cat .ct{color:var(--dim);font-size:12.5px;margin-top:2px}
.cat .bar{height:5px;margin-top:10px}
.cat.all{grid-column:1/-1;background:var(--pnl2)}

/* study */
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px;margin-bottom:8px}
.meta .tag{display:inline-flex;align-items:center;gap:6px}
.meta .dot{width:9px;height:9px;border-radius:50%;background:var(--h)}
.scene{perspective:1400px;margin:6px 0 14px;user-select:none;-webkit-user-select:none}
.card{position:relative;width:100%;min-height:min(58vh,440px);transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
  background:var(--pnl);border:1px solid var(--ln);display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:26px 22px;text-align:center;overflow:auto}
.face::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:20px 20px 0 0;background:var(--h)}
.face.back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--pnl2),var(--pnl))}
.face .lbl{position:absolute;top:16px;left:18px;font-size:12px;color:var(--dim);letter-spacing:.5px}
.face .q{font-size:clamp(22px,5.4vw,32px);font-weight:700;line-height:1.35}
.face .ans{font-size:clamp(21px,5vw,29px);font-weight:700;color:var(--acc2);line-height:1.35}
.face .note{margin-top:16px;color:#c9cfdb;font-size:15.5px;max-width:560px;line-height:1.6}
.face .note b{color:var(--warn)}
.face .ref{margin-top:14px;color:var(--dim);font-size:13.5px}
.face .hint{position:absolute;bottom:14px;color:var(--dim);font-size:12px;opacity:.75}
.badge{position:absolute;top:13px;right:16px;background:rgba(255,209,102,.14);border:1px solid var(--star);color:var(--star);
  border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.mk{position:absolute;top:13px;right:16px;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700}
.mk.ok{color:var(--good);border:1px solid var(--good)} .mk.no{color:var(--bad);border:1px solid var(--bad)}
.badge+.mk{right:110px}
.ctrl{display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:10px}
.btn{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;padding:13px 8px;font-size:15px;font-weight:600;transition:.12s}
.btn:active{transform:scale(.97)}
.btn.nav{font-size:20px;padding:10px 0}
.btn.no{border-color:rgba(255,123,114,.55);color:#ffb3ad}
.btn.no:hover{background:rgba(255,123,114,.12)}
.btn.ok{border-color:rgba(126,231,135,.55);color:#b9f5be}
.btn.ok:hover{background:rgba(126,231,135,.12)}
.btn:disabled{opacity:.35;cursor:default}
.tools{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools .chip{font-size:13px;padding:6px 12px}
.keys{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}

/* summary */
.sum{text-align:center;padding:28px 18px}
.sum .big{font-size:46px;font-weight:800;margin:6px 0}
.sum .row{display:flex;justify-content:center;gap:22px;margin:10px 0 20px;font-size:15px}
.sum .row b{font-size:22px;display:block}
.sum .acts{display:grid;gap:10px;max-width:360px;margin:0 auto}
.empty{text-align:center;color:var(--dim);padding:40px 10px}
/* criteria card */
.face.long{justify-content:flex-start;padding-top:44px}
.face.long .note{text-align:left;width:100%;font-size:15px;margin-top:12px}
.face.long .ans{font-size:clamp(19px,4.4vw,24px)}
.face .note .sec{display:block;color:var(--acc);font-weight:700;margin-top:8px}
/* sync */
.sync .row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sync .st{font-size:14px;color:var(--dim)}
.sync .st b{color:var(--tx)}
.sync .st.err{color:var(--bad)}
.sync .st.ok b{color:var(--good)}
.fld{display:block;margin-top:10px;font-size:13px;color:var(--dim)}
.fld input{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;
  padding:10px 12px;color:var(--tx);font:inherit;font-size:14px}
.fld input:focus{outline:none;border-color:var(--acc)}
.help{font-size:13px;color:var(--dim);margin:8px 0 0;line-height:1.6}
.cloud{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dim);vertical-align:middle}
.cloud.ok{background:var(--good)} .cloud.busy{background:var(--warn)} .cloud.err{background:var(--bad)}
@media (max-width:420px){.modes,.cats{grid-template-columns:1fr}.ctrl{grid-template-columns:44px 1fr 1fr 44px;gap:8px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// [หมวด, sign, โรค, คำอธิบายสั้น, ★]
const CATS = [
  {id:'cv',    name:'หัวใจและหลอดเลือด', icon:'❤️', hue:'#ff7b72'},
  {id:'resp',  name:'ระบบหายใจ',         icon:'🫁', hue:'#5eb3ff'},
  {id:'gi',    name:'ทางเดินอาหารและตับ', icon:'🍽️', hue:'#ffb454'},
  {id:'renal', name:'ไตและปัสสาวะ',      icon:'💧', hue:'#7ee0c0'},
  {id:'endo',  name:'ต่อมไร้ท่อ',         icon:'🦋', hue:'#d2a8ff'},
  {id:'heme',  name:'โลหิตวิทยา',        icon:'🩸', hue:'#ff9bce'},
  {id:'rheum', name:'รูมาติสซั่ม',        icon:'🦴', hue:'#e3b341'},
  {id:'neuro', name:'ประสาทวิทยา',       icon:'🧠', hue:'#a5d6ff'},
  {id:'id',    name:'โรคติดเชื้อ',        icon:'🦠', hue:'#7ee787'},
  {id:'crit',  name:'Criteria อายุรกรรม',  icon:'📋', hue:'#79c0ff', kind:'crit'},
  {id:'psy',   name:'Criteria จิตเวช (DSM-5)', icon:'🧩', hue:'#f0a6ff', kind:'crit'}
];

const RAW = [
// ---------------- หัวใจ ----------------
['cv','Pulsus parvus et tardus','Severe aortic stenosis','ชีพจรเบาและขึ้นช้า เพราะเลือดต้องบีบผ่านลิ้นที่ตีบแคบนานขึ้น · คลำที่ carotid ชัดที่สุด · ผู้สูงอายุหลอดเลือดแข็งอาจไม่เจอ',0],
['cv','Water-hammer (Corrigan) pulse','Aortic regurgitation','ชีพจรพุ่งขึ้นแรงแล้วตกวูบ เพราะ stroke volume มากแล้วเลือดไหลย้อนกลับ LV ช่วง diastole · pulse pressure กว้าง',0],
['cv','de Musset sign','Aortic regurgitation','ศีรษะผงกตามจังหวะชีพจร',0],
['cv','Quincke sign','Aortic regurgitation','กดปลายเล็บเบา ๆ แล้วเห็นเส้นเลือดฝอยใต้เล็บเต้นตามชีพจร',0],
['cv','Duroziez sign','Aortic regurgitation','ใช้หูฟังกด femoral artery แล้วได้ยิน to-and-fro murmur',0],
['cv','Traube sign (pistol shot)','Aortic regurgitation','ได้ยินเสียงแหลมคล้ายยิงปืนเหนือ femoral artery',0],
['cv','Austin Flint murmur','Severe aortic regurgitation','Mid-diastolic rumble ที่ apex เพราะเลือดที่ย้อนจาก aorta ไปกระแทก anterior mitral leaflet',0],
['cv','Pulsus bisferiens','AR, combined AS + AR, HOCM','ชีพจรมีสองยอดในหนึ่ง systole',0],
['cv','Pulsus alternans','Severe LV systolic dysfunction','ชีพจรแรงสลับเบาทุกครั้ง ทั้งที่จังหวะสม่ำเสมอ',0],
['cv','Beck triad','Cardiac tamponade','Hypotension + JVD + heart sound เบา',0],
['cv','Pulsus paradoxus','Cardiac tamponade','SBP ลดลงมากกว่า 10 mmHg ตอนหายใจเข้า · พบใน severe asthma และ COPD ได้ด้วย',0],
['cv','Electrical alternans','Large pericardial effusion / tamponade','QRS สูงต่ำสลับกันเพราะหัวใจแกว่งไปมาในน้ำ',0],
['cv','Kussmaul sign','Constrictive pericarditis','JVP สูงขึ้นตอนหายใจเข้าแทนที่จะลดลง · ระวังสับสนกับ Kussmaul breathing ของ DKA',0],
['cv','Pericardial knock','Constrictive pericarditis','เสียงแหลมต้น diastole เพราะเลือดไหลเข้า ventricle แล้วหยุดกะทันหันเมื่อชนเยื่อหุ้มหัวใจที่แข็ง',0],
['cv','Diffuse ST elevation + PR depression','Acute pericarditis','ST ยกแบบเว้าขึ้นหลาย lead ไม่ตรงตามเส้นเลือด · ฟังได้ pericardial friction rub',0],
['cv','Opening snap + mid-diastolic rumble','Mitral stenosis','Opening snap ยิ่งใกล้ S2 ยิ่งตีบมาก',0],
['cv','Tumor plop','Atrial myxoma','เสียงต้น diastole จากก้อนตกลงผ่าน mitral valve · อาการเปลี่ยนตามท่าทาง',0],
['cv','Mid-systolic click','Mitral valve prolapse','คลิกมาเร็วขึ้นเมื่อยืนหรือทำ Valsalva',0],
['cv','Fixed split S2','Atrial septal defect','S2 แยกกว้างเท่าเดิมทั้งหายใจเข้าและออก',0],
['cv','Paradoxical split S2','LBBB, severe aortic stenosis','S2 แยกตอนหายใจออก และแคบลงตอนหายใจเข้า',0],
['cv','Carvallo sign','Tricuspid regurgitation','Murmur ดังขึ้นตอนหายใจเข้า เพราะเลือดกลับเข้าหัวใจขวามากขึ้น',0],
['cv','Continuous machinery murmur','Patent ductus arteriosus','ดังต่อเนื่องทั้ง systole และ diastole ที่ใต้กระดูกไหปลาร้าซ้าย',0],
['cv','Radio-femoral delay','Coarctation of aorta','ชีพจรที่ขาหนีบมาช้าและเบากว่าข้อมือ · ความดันแขนสูงกว่าขา',0],
['cv','Rib notching / "3 sign" on CXR','Coarctation of aorta','ขอบล่างซี่โครงกร่อนจาก collateral intercostal arteries',0],
['cv','Osler node','Infective endocarditis','ตุ่มนูน **เจ็บ** ที่ปลายนิ้ว จาก immune complex',0],
['cv','Janeway lesion','Infective endocarditis','จุดแดงแบน **ไม่เจ็บ** ที่ฝ่ามือฝ่าเท้า จาก septic emboli',0],
['cv','Roth spot','Infective endocarditis','จุดเลือดออกที่จอตาตรงกลางสีขาว · พบใน leukemia และซีดรุนแรงได้ด้วย',0],
['cv','Splinter hemorrhage','Infective endocarditis','เส้นเลือดออกแนวยาวใต้เล็บ · พบจากการบาดเจ็บได้บ่อย',0],
['cv','Delta wave + short PR','Wolff-Parkinson-White','QRS ขึ้นลาดช้าเพราะ accessory pathway นำไฟฟ้าก่อน AV node',1],
['cv','Osborn (J) wave','Hypothermia','คลื่นนูนที่ J point',0],
['cv','Coved ST elevation V1–V2','Brugada syndrome','ST ยกโค้งลงตามด้วย T หัวกลับ · สาเหตุของไหลตาย',0],
['cv','Wellens sign','Critical proximal LAD stenosis','T wave หัวกลับลึกหรือ biphasic ใน V2–V3 ช่วงที่ไม่เจ็บอก · เสี่ยง anterior MI ใหญ่',0],
['cv','Peaked T wave','Hyperkalemia','T สูงแหลมฐานแคบ เป็นความผิดปกติแรกที่มักเห็น',0],
['cv','Prominent U wave','Hypokalemia','คลื่นเล็กหลัง T ร่วมกับ ST ต่ำ',0],
['cv','S1Q3T3','Pulmonary embolism','Sensitivity ต่ำ · ความผิดปกติที่พบบ่อยที่สุดใน PE คือ sinus tachycardia',0],

// ---------------- ระบบหายใจ ----------------
['resp','Trachea เบี่ยงออก + เคาะโปร่ง + เสียงหายใจหาย + ความดันตก','Tension pneumothorax','วินิจฉัยทางคลินิก เจาะระบายทันทีโดยไม่ต้องรอฟิล์ม',0],
['resp','Deep sulcus sign','Pneumothorax (ฟิล์มท่านอน)','มุม costophrenic ลึกและโปร่งผิดปกติ',0],
['resp','Westermark sign','Pulmonary embolism','ปอดบางส่วนดำโล่งเพราะเลือดไปเลี้ยงลดลง',0],
['resp','Hampton hump','Pulmonary embolism','เงาทึบรูปลิ่มติดเยื่อหุ้มปอด จาก pulmonary infarction',0],
['resp','Kerley B lines','Interstitial pulmonary edema','เส้นสั้นแนวนอนที่ขอบปอดส่วนล่าง',0],
['resp','Bat-wing appearance','Alveolar pulmonary edema','เงาทึบรอบขั้วปอดสองข้างคล้ายปีกค้างคาว',0],
['resp','Air crescent (Monod) sign','Aspergilloma','ลมเป็นรูปเสี้ยวรอบก้อนเชื้อราในโพรงปอดเดิม',0],
['resp','Halo sign','Invasive aspergillosis','ก้อนล้อมด้วยวง ground-glass จากเลือดออก ในผู้ป่วยภูมิคุ้มกันต่ำ',0],
['resp','Egg-shell calcification ของต่อมน้ำเหลืองขั้วปอด','Silicosis','พบใน sarcoidosis ได้ด้วย',0],
['resp','Ghon complex','Primary tuberculosis','Ghon focus ในเนื้อปอดร่วมกับต่อมน้ำเหลืองขั้วปอด',0],
['resp','Velcro crackles','Idiopathic pulmonary fibrosis','Crackles ละเอียดปลายหายใจเข้า เสียงเหมือนแกะตีนตุ๊กแก',0],
['resp','Charcot-Leyden crystals','Asthma','ผลึกจาก eosinophil ในเสมหะ',0],
['resp','Curschmann spirals','Asthma','เมือกเป็นเกลียวจากหลอดลมฝอย',0],
['resp','Pemberton sign','SVC obstruction / retrosternal goiter','ยกแขนสองข้างขึ้นแล้วหน้าแดงคั่ง',0],
['resp','Horner syndrome + ปวดไหล่ร้าวแขน','Pancoast tumor','มะเร็งที่ยอดปอดกด sympathetic chain และ brachial plexus',0],
['resp','Hypertrophic osteoarthropathy + clubbing','Lung cancer (adenocarcinoma)','ปวดข้อและกระดูกยาวร่วมกับนิ้วปุ้ม',0],

// ---------------- ทางเดินอาหารและตับ ----------------
['gi','Murphy sign','Acute cholecystitis','กดใต้ชายโครงขวาแล้วผู้ป่วยหยุดหายใจเข้ากลางคัน',0],
['gi','Courvoisier sign','มะเร็งหัวตับอ่อน / ท่อน้ำดีส่วนปลาย','คลำถุงน้ำดีได้ ไม่เจ็บ + ตัวเหลือง · นิ่วมักไม่ทำให้ถุงน้ำดีโตเพราะอักเสบเรื้อรังจนแข็ง',0],
['gi','Charcot triad','Ascending cholangitis','ไข้ + ปวดชายโครงขวา + ตัวเหลือง',0],
['gi','Reynolds pentad','Severe (suppurative) cholangitis','Charcot triad + ซึมสับสน + ช็อก',0],
['gi','Cullen sign','เลือดออกในช่องท้อง (hemorrhagic pancreatitis)','จ้ำเลือดรอบสะดือ',0],
['gi','Grey Turner sign','เลือดออกหลังเยื่อบุช่องท้อง (hemorrhagic pancreatitis)','จ้ำเลือดที่สีข้าง',0],
['gi','McBurney point tenderness','Acute appendicitis','กดเจ็บที่ 1/3 ของเส้นจาก ASIS ไปสะดือ',0],
['gi','Rovsing sign','Acute appendicitis','กดท้องน้อยซ้ายแล้วเจ็บที่ท้องน้อยขวา',0],
['gi','Psoas sign','Retrocecal appendicitis','เหยียดสะโพกขวาแล้วเจ็บ',0],
['gi','Obturator sign','Pelvic appendicitis','งอและหมุนสะโพกขวาเข้าในแล้วเจ็บ',0],
['gi','Kehr sign','Splenic rupture','ปวดร้าวไหล่ซ้าย จากเลือดระคายกระบังลม',0],

var SKEY='pathoFC.sync';

try{SY=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){SY=null;}
var SYNC={busy:false,dirty:false,timer:null,last:null,err:null,again:false};

function tsv(v){return typeof v==='number'?v:1;}
function progOf(o){return {known:o.known||{},miss:o.miss||{},resetAt:o.resetAt||0};}
function mergeProg(a,b){
  a=progOf(a||{});b=progOf(b||{});
  var r={known:{},miss:{},resetAt:Math.max(a.resetAt,b.resetAt)}, ids={};
  [a.known,a.miss,b.known,b.miss].forEach(function(m){for(var k in m)ids[k]=1;});
  for(var id in ids){
    var best=null,bt=-1;
    [['known',a],['miss',a],['known',b],['miss',b]].forEach(function(x){
      var m=x[1][x[0]]; if(Object.prototype.hasOwnProperty.call(m,id)){var t=tsv(m[id]); if(t>bt){bt=t;best=x[0];}}
    });
    if(best && bt>r.resetAt) r[best][id]=bt;
  }
  return r;
}
function sameProg(a,b){
  a=progOf(a);b=progOf(b);
  if(a.resetAt!==b.resetAt) return false;
  var f=function(x,y){var kx=Object.keys(x),ky=Object.keys(y);if(kx.length!==ky.length)return false;
    for(var i=0;i<kx.length;i++){if(tsv(x[kx[i]])!==tsv(y[kx[i]]))return false;}return true;};
  return f(a.known,b.known)&&f(a.miss,b.miss);
}
function syncStatus(){
  if(!SY) return {cls:'',txt:'ยังไม่ได้ตั้งค่า — ความคืบหน้าเก็บเฉพาะเครื่องนี้'};
  if(SYNC.busy) return {cls:'busy',txt:'กำลังซิงค์…'};
  if(SYNC.err) return {cls:'err',txt:'ซิงค์ไม่สำเร็จ: '+SYNC.err+' — จะลองใหม่อัตโนมัติ'};
  if(SYNC.last){var t=SYNC.last;return {cls:'ok',txt:'ซิงค์ล่าสุด <b>'+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+'</b>'};}
  return {cls:'',txt:'ตั้งค่าแล้ว รอซิงค์ครั้งแรก'};
}
function paintSync(){
  var el=document.getElementById('syncSt'); if(!el) return;
  var s=syncStatus(); el.className='st '+s.cls; el.innerHTML='<span class="cloud '+s.cls+'"></span>'+s.txt;
}
function syncNow(){
  if(!SY) return Promise.resolve();
  if(SYNC.busy){SYNC.again=true;return Promise.resolve();}
  SYNC.busy=true; SYNC.again=false; clearTimeout(SYNC.timer); paintSync();
  var hadDirty=SYNC.dirty; SYNC.dirty=false;
  return fetch(SY.url+(SY.url.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(SY.code)+'&_='+Date.now())
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res||!res.ok) throw new Error((res&&res.err)||'เซิร์ฟเวอร์ตอบกลับผิดรูปแบบ');
      var remote=progOf(res.data||{});
      var local=progOf(P);
      var m=mergeProg(local,remote);
      var changedLocal=!sameProg(m,local);
      P.known=m.known;P.miss=m.miss;P.resetAt=m.resetAt;save();
      if(changedLocal) refreshView();
      if(hadDirty || !sameProg(m,remote)){
        return fetch(SY.url,{method:'POST',body:JSON.stringify({key:SY.code,data:m})})
          .then(function(r){return r.json();})
          .then(function(x){if(!x||!x.ok) throw new Error((x&&x.err)||'บันทึกไม่สำเร็จ');});
      }
    })
    .then(function(){SYNC.last=new Date();SYNC.err=null;})
    .catch(function(e){SYNC.err=String((e&&e.message)||e);SYNC.dirty=SYNC.dirty||hadDirty;})
    .then(function(){
      SYNC.busy=false; paintSync();
      if(SYNC.again||(SYNC.err&&SYNC.dirty)) SYNC.timer=setTimeout(syncNow,SYNC.err?15000:800);
    });
}
function schedulePush(){ if(!SY) return; SYNC.dirty=true; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncNow,1500); }
function flushBeacon(){
  if(!SY||!SYNC.dirty||!navigator.sendBeacon) return;
  try{ navigator.sendBeacon(SY.url,new Blob([JSON.stringify({key:SY.code,data:progOf(P)})],{type:'text/plain'})); SYNC.dirty=false; }catch(e){}
}
function refreshView(){ if(S.view==='home') home(); else if(S.view==='cats') cats(); else if(S.view==='sum') summary(); }
function syncLink(){
  var raw=SY.url+'|'+SY.code;
  var b=btoa(unescape(encodeURIComponent(raw)));
  return location.href.split('#')[0]+'#sync='+b;
}
function readSyncHash(){
  var m=/^#sync=(.+)$/.exec(location.hash||''); if(!m) return false;
  try{
    var raw=decodeURIComponent(escape(atob(decodeURIComponent(m[1])))), i=raw.lastIndexOf('|');
    if(i>0){SY={url:raw.slice(0,i),code:raw.slice(i+1)};localStorage.setItem(SKEY,JSON.stringify(SY));}
  }catch(e){}
  try{history.replaceState(null,'',location.href.split('#')[0]);}catch(e){location.hash='';}
  return true;
}

function esc(t){return String(t).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function rich(t){
  return String(t).split('\n').map(function(line){
    var h=/^#\s*/.test(line);
    var x=esc(line.replace(/^#\s*/,'')).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    return h?'<span class="sec">'+x+'</span>':x;
  }).join('<br>').replace(/<\/span><br>/g,'</span>');
}
function isLong(c){return c.n.indexOf('\n')>=0;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function knownCount(list){return list.filter(function(c){return P.known[c.id];}).length;}
function pct(a,b){return b?Math.round(a*100/b):0;}

function filtered(list){
  return list.filter(function(c){
    if(P.star && !c.p) return false;
    if(P.unk && P.known[c.id]) return false;
    return true;
  });
}

    h+='<label class="fld">Web app URL จาก Apps Script<input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(SY?SY.url:'')+'"></label>'+
       '<label class="fld">รหัสซิงค์ (ตั้งเอง อย่างน้อย 4 ตัว ใช้รหัสเดียวกันทุกเครื่อง)<input id="sCode" placeholder="เช่น miw-flash-2569" value="'+esc(SY?SY.code:'')+'"></label>'+
       '<div class="row2"><button class="chip on" onclick="saveSync()">บันทึกและซิงค์</button>'+
       (SY?'<button class="chip" onclick="SYNC_FORM=false;home()">ยกเลิก</button>':'')+'</div>'+
       '<p class="help">ตั้งค่าแค่เครื่องแรกเครื่องเดียว เครื่องอื่นใช้ปุ่ม "คัดลอกลิงก์สำหรับเครื่องอื่น" · วิธีสร้าง Web app ดูในไฟล์ วิธีตั้งค่าซิงค์ ที่มากับเว็บ</p>';
  }
  return h+'</div>';
}
function saveSync(){
  var u=document.getElementById('sUrl').value.trim(), c=document.getElementById('sCode').value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){alert('URL ต้องขึ้นต้นด้วย https://script.google.com/');return;}
  if(c.length<4){alert('รหัสซิงค์ต้องยาวอย่างน้อย 4 ตัวอักษร');return;}
  SY={url:u,code:c}; try{localStorage.setItem(SKEY,JSON.stringify(SY));}catch(e){}
  SYNC_FORM=false; SYNC.err=null; SYNC.dirty=true; home(); syncNow();
}
function stopSync(){
  if(!confirm('เลิกซิงค์บนเครื่องนี้? ความคืบหน้าในเครื่องยังอยู่ ส่วนข้อมูลใน Google Sheet ไม่ถูกลบ'))return;
  SY=null; try{localStorage.removeItem(SKEY);}catch(e){} SYNC.last=null; SYNC.err=null; home();
}
function copyLink(){
  var l=syncLink();
  var done=function(){alert('คัดลอกลิงก์แล้ว — ส่งให้ตัวเองแล้วเปิดบนอีกเครื่อง');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(l).then(done,function(){prompt('คัดลอกลิงก์นี้',l);});}
  else prompt('คัดลอกลิงก์นี้',l);
}
function setDir(d){P.dir=d;save();home();}
function tog(k){P[k]=!P[k];save();home();}
function resetAll(){
  if(confirm('ล้างข้อมูลจำได้/ยังไม่ได้ทั้งหมด?'+(SY?' (ทุกเครื่องที่ซิงค์จะถูกล้างด้วย)':''))){
    P.known={};P.miss={};P.resetAt=Date.now();save();home();schedulePush();
  }
}

// ---------------- หน้าเลือกหมวด ----------------
function cats(){
  S.view='cats';
  var h='<header class="top"><button class="back" onclick="home()">← หน้าแรก</button><div><h1>แยกตามหมวด</h1>'+
        '<div class="sub">'+(P.star?'★ เฉพาะ pathognomonic · ':'')+(P.unk?'เฉพาะที่ยังจำไม่ได้':'ทุกการ์ด')+'</div></div></header><div class="cats">';
  CATS.forEach(function(c){
    var all=CARDS.filter(function(x){return x.c===c.id;}), use=filtered(all), k=knownCount(all);
    h+='<button class="cat" style="--h:'+c.hue+'" onclick="startCat(\''+c.id+'\')">'+
       '<div class="nm">'+c.icon+' '+esc(c.name)+'</div>'+
       '<div class="ct">'+use.length+' การ์ด'+(use.length!==all.length?' (จาก '+all.length+')':'')+' · จำได้ '+k+'/'+all.length+'</div>'+
       '<div class="bar"><i style="width:'+pct(k,all.length)+'%"></i></div></button>';
  });
  h+='</div>';
  app.innerHTML=h;
}

// ---------------- เริ่มสำรับ ----------------
function startCat(id){
  var base=CARDS.filter(function(x){return x.c===id;});
  begin(filtered(base), CAT[id].icon+' '+CAT[id].name, {type:'cat',id:id}, false);
}
function startAll(){ begin(shuffle(filtered(CARDS)), '🔀 สุ่มรวมทุกหมวด', {type:'all'}, true); }
function begin(deck,title,src,shuf){
  S.deck=deck;S.i=0;S.flip=false;S.title=title;S.src=src;S.shuf=shuf;S.ok=0;S.no=0;S.view='study';
  study();
}
function restartSame(onlyMissed){
  var base = S.src.type==='cat' ? CARDS.filter(function(x){return x.c===S.src.id;}) : CARDS;
  var d = filtered(base);
  if(onlyMissed) d = d.filter(function(c){return P.miss[c.id];});
  if(S.src.type==='all' || S.shuf) d = shuffle(d);
  begin(d,S.title,S.src,S.shuf);
}

// ---------------- หน้าเรียน ----------------
function study(){
  S.view='study';
  if(!S.deck.length){
    app.innerHTML='<header class="top"><button class="back" onclick="leave()">← กลับ</button><h1>'+esc(S.title)+'</h1></header>'+
      '<div class="empty">ไม่มีการ์ดตามเงื่อนไขที่ตั้งไว้<br>ลองปิดตัวกรอง ★ หรือ "เฉพาะที่ยังจำไม่ได้" ที่หน้าแรก</div>';
    return;
  }
  if(S.i>=S.deck.length){summary();return;}
  var c=S.deck[S.i], cat=CAT[c.c];
  var q = P.dir==='sd' ? c.s : c.d;
  var a = P.dir==='sd' ? c.d : c.s;
  var ref = P.dir==='sd' ? c.s : c.d;
  var mk = P.known[c.id] ? '<span class="mk ok">จำได้</span>' : (P.miss[c.id] ? '<span class="mk no">ยังไม่ได้</span>' : '');
  var badge = c.p ? '<span class="badge">★ pathognomonic</span>' : '';
  var crit = cat.kind==='crit';
  var lq = crit ? (P.dir==='sd'?'CRITERIA':'ใช้วินิจฉัย') : (P.dir==='sd'?'SIGN':'โรค');
  var la = crit ? (P.dir==='sd'?'ใช้วินิจฉัย':'CRITERIA') : (P.dir==='sd'?'โรค':'SIGN');
  var lng = isLong(c) ? ' long' : '';
  app.innerHTML=
   '<header class="top"><button class="back" onclick="leave()">← กลับ</button><div><h1>'+esc(S.title)+'</h1>'+
   '<div class="sub">'+(P.dir==='sd'?'ถาม sign → ตอบโรค':'ถามโรค → ตอบ sign')+'</div></div></header>'+
   '<div class="meta" style="--h:'+cat.hue+'"><span class="tag"><span class="dot"></span>'+esc(cat.name)+'</span>'+
   '<span>'+(S.i+1)+' / '+S.deck.length+'</span></div>'+
   '<div class="bar" style="margin:0 0 10px"><i style="width:'+pct(S.i,S.deck.length)+'%"></i></div>'+
   '<div class="scene" id="scene" style="--h:'+cat.hue+'"><div class="card'+(S.flip?' flip':'')+'" id="card">'+
     '<div class="face front"><span class="lbl">'+lq+'</span>'+badge+mk+
        '<div class="q">'+esc(q)+'</div><div class="hint">'+(crit?'นึกให้ครบก่อน แล้วแตะเพื่อพลิก':'แตะเพื่อพลิก')+'</div></div>'+
     '<div class="face back'+lng+'"><span class="lbl">'+la+'</span>'+badge+
        '<div class="ans">'+esc(a)+'</div><div class="note">'+rich(c.n)+'</div>'+
        '<div class="ref">'+esc(ref)+'</div></div>'+
   '</div></div>'+
   '<div class="ctrl">'+
     '<button class="btn nav" onclick="prev()" '+(S.i===0?'disabled':'')+' aria-label="ก่อนหน้า">‹</button>'+
     '<button class="btn no" onclick="mark(false)">✗ ยังไม่ได้</button>'+
     '<button class="btn ok" onclick="mark(true)">✓ จำได้</button>'+
     '<button class="btn nav" onclick="next()" aria-label="ถัดไป">›</button>'+
   '</div>'+
   '<div class="tools"><button class="chip" onclick="reshuffle()">🔀 สลับลำดับใหม่</button>'+
   '<button class="chip" onclick="flip()">↻ พลิกการ์ด</button></div>'+
   '<div class="keys">คีย์ลัด: Space พลิก · ← → เลื่อน · 1 ยังไม่ได้ · 2 จำได้ · มือถือปัดซ้ายขวาได้</div>';
  var sc=document.getElementById('scene');
  sc.addEventListener('click',flip);
  var x0=null,y0=null;
  sc.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  sc.addEventListener('touchend',function(e){
    if(x0===null)return;var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){e.preventDefault(); if(dx<0)next(); else prev();}
  });
}
function flip(){ if(S.view!=='study'||!S.deck.length)return; S.flip=!S.flip; var el=document.getElementById('card'); if(el) el.classList.toggle('flip',S.flip); }
function next(){ if(S.view!=='study')return; S.i++; S.flip=false; study(); }
function prev(){ if(S.view!=='study'||S.i===0)return; S.i--; S.flip=false; study(); }
function mark(ok){
  if(S.view!=='study'||!S.deck.length)return;
  var c=S.deck[S.i];
  var now=Date.now();
  if(ok){P.known[c.id]=now;delete P.miss[c.id];S.ok++;} else {P.miss[c.id]=now;delete P.known[c.id];S.no++;}
  save(); schedulePush(); next();
}
function reshuffle(){ S.deck=shuffle(S.deck); S.i=0; S.flip=false; S.shuf=true; study(); }
function leave(){ if(S.src&&S.src.type==='cat') cats(); else home(); }

// ---------------- สรุปท้ายสำรับ ----------------
function summary(){
  S.view='sum';
  var missed=S.deck.filter(function(c){return P.miss[c.id];}).length;
  var tot=S.deck.length, k=S.deck.filter(function(c){return P.known[c.id];}).length;
  app.innerHTML='<header class="top"><button class="back" onclick="leave()">← กลับ</button><h1>'+esc(S.title)+'</h1></header>'+
   '<div class="panel sum"><div style="font-size:40px">'+(k===tot?'🎉':'📘')+'</div>'+
   '<div class="big">'+pct(k,tot)+'%</div><div style="color:var(--dim)">จำได้ในสำรับนี้</div>'+
   '<div class="row"><div><b style="color:var(--good)">'+k+'</b>จำได้</div><div><b style="color:var(--bad)">'+missed+'</b>ยังไม่ได้</div><div><b>'+tot+'</b>ทั้งหมด</div></div>'+
   '<div class="acts">'+
     (missed?'<button class="btn no" onclick="restartSame(true)">ทวนเฉพาะที่ยังไม่ได้ ('+missed+')</button>':'')+
     '<button class="btn" onclick="restartSame(false)">เริ่มสำรับนี้ใหม่</button>'+
     '<button class="btn" onclick="home()">กลับหน้าแรก</button>'+
   '</div></div>';
}

// ---------------- คีย์ลัด ----------------
document.addEventListener('keydown',function(e){
  if(S.view!=='study')return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  else if(e.key==='ArrowRight'){next();}
  else if(e.key==='ArrowLeft'){prev();}
  else if(e.key==='1'){mark(false);}
  else if(e.key==='2'){mark(true);}
});

// ---------------- เริ่มทำงาน ----------------
readSyncHash();
home();
if(SY) syncNow();
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden') flushBeacon();
  else if(SY) syncNow();
});
window.addEventListener('pagehide',flushBeacon);
window.addEventListener('online',function(){if(SY)syncNow();});
</script>
</body>
</html>
